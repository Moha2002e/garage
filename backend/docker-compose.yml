services:
  postgres:
    image: postgres:16
    container_name: garage-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-garage}
      POSTGRES_USER: ${DB_USER:-garage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - garage-pgdata:/var/lib/postgresql/data

volumes:
  garage-pgdata:
