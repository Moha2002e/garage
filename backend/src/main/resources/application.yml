spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: garage-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/garage}
    username: ${DB_USER:garage}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftl

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    session-hours: 8
    remember-days: 30
  cookie:
    name: garage_token
    secure: ${COOKIE_SECURE:false}
  front-url: ${FRONT_URL:http://localhost:4200}
  cors-origin: ${FRONT_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:no-reply@garage.local}
  reset-token-minutes: 30
  export-max-rows: 5000
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
