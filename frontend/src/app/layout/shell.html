<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <app-logo class="brand-logo" />
      <span>Garage</span>
    </div>

    <nav class="menu" aria-label="Menu">
      @for (entry of entries(); track entry.route) {
        <a
          class="menu-item"
          [routerLink]="entry.route"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          <i [class]="entry.icon"></i>
          <span class="menu-label">{{ entry.key | translate }}</span>
          <span class="menu-dot" aria-hidden="true"></span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      @if (auth.user(); as user) {
        <div class="user">
          <strong>{{ user.firstName }} {{ user.lastName }}</strong>
          <small>{{ 'roles.' + user.role | translate }}</small>
        </div>
      }
      <app-language-switch />
      <p-button
        [label]="'menu.logout' | translate"
        icon="pi pi-sign-out"
        severity="secondary"
        [outlined]="true"
        (onClick)="onLogout()"
        fluid
      />
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
