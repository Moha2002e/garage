<section class="page">
  <h1 class="page-title">{{ 'stats.title' | translate }}</h1>

  <div class="toolbar">
    <label for="year">{{ 'stats.year' | translate }}</label>
    <p-select
      inputId="year"
      [options]="years"
      [ngModel]="year()"
      (ngModelChange)="onYearChange($event)"
      [disabled]="isLoading()"
    />
  </div>

  <div class="chart-box" [class.is-loading]="isLoading()">
    <p-chart type="line" [data]="chartData()" [options]="chartOptions()" height="26rem" />
  </div>
</section>
